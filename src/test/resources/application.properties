# ===============================
# DATASOURCE (H2 IN-MEMORY)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS meethub_schema\\;SET SCHEMA meethub_schema
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.default_schema=meethub_schema

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ? NIE generuj schematu z Hibernate (u?ywamy schema.sql)
spring.jpa.hibernate.ddl-auto=none

# ===============================
# SQL INIT (schema.sql + data.sql)
# ===============================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.platform=h2

# ===============================
# WY??CZENIE MIGRACJI
# ===============================
spring.flyway.enabled=false
spring.liquibase.enabled=false

# ===============================
# LOGI (opcjonalne, ale polecam)
# ===============================
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
logging.level.org.springframework.jdbc.datasource.init=debug

# ===============================
# VALIDATION
# ===============================
spring.jpa.properties.javax.persistence.validation.mode=auto
