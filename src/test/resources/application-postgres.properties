# ==========================================
# KONFIGURACJA BAZY DANYCH H2 DLA TESTÓW
# ==========================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.default_schema=meethub_schema

# ==========================================
# INICJALIZACJA SQL DLA TESTÓW
# ==========================================

# W??cz inicjalizacj? danych dla testów
spring.sql.init.enabled=true
spring.sql.init.mode=always

# U?yj NASZYCH plików SQL, nie tych z main/resources
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Wy??cz auto-DDL Hibernate (u?ywamy naszego schema.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# ==========================================
# KONFIGURACJA JPA/HIBERNATE
# ==========================================

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================
# LOGOWANIE
# ==========================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc=DEBUG