spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

app.upload.directory=uploads/
app.reports.directory=reports/
app.documents.directory=uploads/documents/
app.photos.directory=uploads/photos/

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

app.jwt.secret=your-super-secret-key-that-is-at-least-32-characters-long
app.jwt.expiration=86400000  
app.jwt.refresh-expiration=604800000  

# DATABASE CONFIGURATION - DODAJ USERNAME I PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/meethub?currentSchema=meethub_schema
spring.datasource.username=meethub_user
spring.datasource.password=secure_password123

# JPA CONFIGURATION
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=meethub_schema
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Wy??cz cache dla development
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Geocoding
app.geocoding.enabled=false
app.geocoding.api-key=


logging.level.com.meethub.controller.web.ParticipantController=DEBUG
logging.level.org.springframework.web=DEBUG



file.upload-dir=uploads

# Allowed file types
app.allowed-file-types=pdf,ppt,pptx,doc,docx,xls,xlsx,txt,jpg,jpeg,png



# SPRING SECURITY DEBUG
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG
logging.level.com.meethub.security=DEBUG

# HIBERNATE SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# SHOW ERRORS
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# APPLICATION DEBUG
logging.level.com.meethub=DEBUG



