spring:
  application:
    name: meethub
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/meethub
    username: meethub_user
    password: ${DB_PASSWORD:secure_password123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        show_sql: false
        generate_statistics: false
    show-sql: false

  sql:
    init:
      platform: postgresql
      mode: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.meethub: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/meethub.log

app:
  jwt:
    secret: "mySuperSecretKeyForJWTGenerationInMeetHubApplication2024ThatIsVeryLongAndSecure"
    expiration: 86400000  # 24 godziny w milisekundach
    refresh-expiration: 604800000  # 7 dni w milisekundach
  file:
    upload-dir: ./uploads
    max-size: 10485760 # 10MB
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8080"
  geocoding:
    enabled: true
    api-key: ${GOOGLE_MAPS_API_KEY:}
    security:
      allowed-origins: http://localhost:3000,http://localhost:8080