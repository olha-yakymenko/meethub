<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pl"
      th:replace="~{layout}">
<head>
    <title th:text="'Dodaj zasób - ' + ${meeting?.title} + ' - MeetHub'">Dodaj zasób - MeetHub</title>
</head>
<body>
<div th:fragment="content">
    <!-- Nagłówek -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/meetings}">Spotkania</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/meetings/{id}(id=${meeting.id})}" th:text="${meeting.title}"></a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/meetings/{id}/resources(id=${meeting.id})}">Zasoby</a>
                    </li>
                    <li class="breadcrumb-item active">Dodaj zasób</li>
                </ol>
            </nav>
            <h1 class="display-6">
                <i class="bi bi-plus-circle me-2"></i>Dodaj zasób
            </h1>
            <p class="text-muted" th:text="${meeting.title}"></p>
        </div>
        <a th:href="@{/meetings/{id}/resources(id=${meeting.id})}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Powrót do zasobów
        </a>
    </div>

    <!-- Formularz -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/api/meetings/{id}/resources(id=${meeting.id})}"
                          th:object="${meetingResourceRequest}"
                          method="post"
                          enctype="multipart/form-data"
                          novalidate>

                        <!-- Plik -->
                        <div class="mb-3">
                            <label for="file" class="form-label">Plik *</label>
                            <input type="file"
                                   class="form-control"
                                   id="file"
                                   th:field="*{file}"
                                   accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png,.gif,.mp4,.mp3,.zip,.txt"
                                   required>
                            <div class="form-text">
                                Obsługiwane formaty: PDF, DOC, DOCX, PPT, PPTX, XLS, XLSX, JPG, PNG, GIF, MP4, MP3, ZIP, TXT<br>
                                Maksymalny rozmiar: 50MB
                            </div>
                            <div th:if="${#fields.hasErrors('file')}" class="text-danger">
                                <small th:errors="*{file}"></small>
                            </div>
                        </div>

                        <!-- Nazwa pliku -->
                        <div class="mb-3">
                            <label for="originalFilename" class="form-label">Nazwa pliku *</label>
                            <input type="text"
                                   class="form-control"
                                   id="originalFilename"
                                   th:field="*{originalFilename}"
                                   placeholder="Np. Prezentacja projektu Q4"
                                   required>
                            <div class="form-text">Podaj czytelną nazwę pliku</div>
                            <div th:if="${#fields.hasErrors('originalFilename')}" class="text-danger">
                                <small th:errors="*{originalFilename}"></small>
                            </div>
                        </div>

                        <!-- Poziom dostępu -->
                        <div class="mb-3">
                            <label for="accessLevel" class="form-label">Poziom dostępu *</label>
                            <select class="form-select"
                                    id="accessLevel"
                                    th:field="*{accessLevel}"
                                    required>
                                <option value="">Wybierz poziom dostępu...</option>
                                <option value="PUBLIC">Publiczny - dostępny dla wszystkich</option>
                                <option value="PARTICIPANTS">Uczestnicy - tylko dla uczestników spotkania</option>
                                <option value="ORGANIZERS">Organizatorzy - tylko dla organizatorów</option>
                                <option value="PRIVATE">Prywatny - tylko dla mnie</option>
                            </select>
                            <div th:if="${#fields.hasErrors('accessLevel')}" class="text-danger">
                                <small th:errors="*{accessLevel}"></small>
                            </div>
                        </div>

                        <!-- Tagi -->
                        <div class="mb-3">
                            <label for="tags" class="form-label">Tagi</label>
                            <input type="text"
                                   class="form-control"
                                   id="tags"
                                   th:field="*{tags}"
                                   placeholder="prezentacja, projekt, raport">
                            <div class="form-text">Tagi oddziel przecinkami</div>
                        </div>

                        <!-- Przyciski -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-upload me-2"></i>Dodaj zasób
                            </button>
                            <a th:href="@{/meetings/{id}/resources(id=${meeting.id})}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Anuluj
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.getElementById('file');
        const filenameInput = document.getElementById('originalFilename');

        // Automatyczne uzupełnianie nazwy pliku
        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0] && !filenameInput.value) {
                const originalName = this.files[0].name;
                // Usuń rozszerzenie pliku dla lepszej czytelności
                const nameWithoutExt = originalName.replace(/\.[^/.]+$/, "");
                filenameInput.value = nameWithoutExt;
            }
        });

        // Walidacja rozmiaru pliku
        fileInput.addEventListener('change', function() {
            const maxSize = 50 * 1024 * 1024; // 50MB
            if (this.files && this.files[0] && this.files[0].size > maxSize) {
                alert('Plik jest zbyt duży. Maksymalny rozmiar to 50MB.');
                this.value = '';
            }
        });
    });
</script>
</body>
</html>
