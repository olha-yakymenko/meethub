<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="pl"
      th:replace="~{layout}">
<head>
    <title>Utwórz głosowanie - MeetHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">
                        <i class="bi bi-plus-circle me-2"></i>Utwórz nowe głosowanie
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/meetings/{meetingId}/votings/create(meetingId=${meetingId})}"
                          method="post" th:object="${createVotingRequest}">

                        <!-- Tytuł -->
                        <div class="mb-3">
                            <label for="title" class="form-label">Tytuł głosowania *</label>
                            <input type="text" class="form-control" id="title" th:field="*{title}"
                                   placeholder="np. Wybór terminu spotkania" required>
                            <div class="form-text">Krótki opis głosowania</div>
                        </div>

                        <!-- Opis -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Opis</label>
                            <textarea class="form-control" id="description" th:field="*{description}"
                                      rows="3" placeholder="Dodatkowe informacje o głosowaniu..."></textarea>
                        </div>

                        <!-- Typ głosowania -->
                        <div class="mb-3">
                            <label class="form-label">Typ głosowania *</label>
                            <select class="form-select" th:field="*{type}" required>
                                <option value="">Wybierz typ głosowania</option>
                                <option value="SINGLE_CHOICE">Pojedynczy wybór</option>
                                <option value="MULTIPLE_CHOICE">Wielokrotny wybór</option>
                                <option value="RANKED">Głosowanie rankingowe</option>
                            </select>
                        </div>

                        <!-- Maksymalna liczba wyborów -->
                        <div class="mb-3">
                            <label for="maxChoices" class="form-label">Maksymalna liczba wyborów</label>
                            <input type="number" class="form-control" id="maxChoices"
                                   th:field="*{maxChoices}" min="1" max="10">
                            <div class="form-text">Pozostaw puste dla nieograniczonej liczby</div>
                        </div>

                        <!-- Data zakończenia -->
                        <div class="mb-3">
                            <label for="deadlineDate" class="form-label">Data zakończenia głosowania</label>
                            <input type="datetime-local" class="form-control" id="deadlineDate"
                                   th:field="*{deadlineDate}">
                        </div>

                        <!-- Opcje -->
                        <div class="mb-4">
                            <label class="form-label">Opcje głosowania *</label>
                            <div id="options-container">
                                <div class="option-item mb-2 p-2 border rounded">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label class="form-label">Data i godzina</label>
                                            <input type="datetime-local" class="form-control option-date"
                                                   name="options[0].optionDate" required>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Czas trwania (min)</label>
                                            <input type="number" class="form-control option-duration"
                                                   name="options[0].durationMinutes" value="60" min="15" max="480">
                                        </div>
                                        <div class="col-md-2 d-flex align-items-end">
                                            <button type="button" class="btn btn-danger btn-sm remove-option"
                                                    style="display: none;">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button type="button" id="add-option" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-plus me-1"></i>Dodaj opcję
                            </button>
                        </div>

                        <!-- Ustawienia dodatkowe -->
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{allowSuggestions}" id="allowSuggestions">
                                <label class="form-check-label" for="allowSuggestions">
                                    Zezwól uczestnikom na sugerowanie nowych opcji
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{autoClose}" id="autoClose">
                                <label class="form-check-label" for="autoClose">
                                    Automatycznie zamknij głosowanie po upływie terminu
                                </label>
                            </div>
                        </div>

                        <!-- Przyciski -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Utwórz głosowanie
                            </button>
                            <a th:href="@{/meetings/{meetingId}/votings(meetingId=${meetingId})}"
                               class="btn btn-outline-secondary">
                                Anuluj
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- SKRYPT MUSI BYĆ W TYM SAMYM FRAGMENCIE CONTENT! -->
    <script>
        console.log('=== SKRYPT CREATE.HTML ZAŁADOWANY ===');

        // Funkcja inicjalizująca
        function initVotingForm() {
            console.log('=== INICJALIZACJA FORMULARZA ===');

            const addButton = document.getElementById('add-option');
            const container = document.getElementById('options-container');

            console.log('Przycisk "add-option":', addButton);
            console.log('Kontener "options-container":', container);

            if (!addButton) {
                console.error('ERROR: Nie znaleziono przycisku #add-option');
                alert('BŁĄD: Nie znaleziono przycisku "Dodaj opcję"');
                return;
            }

            if (!container) {
                console.error('ERROR: Nie znaleziono kontenera #options-container');
                return;
            }

            // Ustaw domyślną datę na jutro
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const defaultDate = tomorrow.toISOString().slice(0, 16);

            // Inicjalizacja daty w pierwszym polu
            const firstDateInput = container.querySelector('.option-date');
            if (firstDateInput && !firstDateInput.value) {
                firstDateInput.value = defaultDate;
            }

            // Funkcja dodająca nową opcję
            function addNewOption() {
                console.log('=== DODAWANIE NOWEJ OPCJI ===');

                const options = container.querySelectorAll('.option-item');
                const nextIndex = options.length;

                if (nextIndex >= 10) {
                    alert('Maksymalnie można dodać 10 opcji');
                    return;
                }

                const newOption = document.createElement('div');
                newOption.className = 'option-item mb-2 p-2 border rounded';
                newOption.innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Data i godzina</label>
                            <input type="datetime-local" class="form-control option-date"
                                   name="options[${nextIndex}].optionDate"
                                   value="${defaultDate}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Czas trwania (min)</label>
                            <input type="number" class="form-control option-duration"
                                   name="options[${nextIndex}].durationMinutes"
                                   value="60" min="15" max="480">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="button" class="btn btn-danger btn-sm remove-option">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(newOption);
                console.log(`Dodano opcję nr ${nextIndex}`);

                updateRemoveButtons();
                reindexOptions();
            }

            // Funkcja aktualizująca przyciski usuwania
            function updateRemoveButtons() {
                const options = container.querySelectorAll('.option-item');
                const removeButtons = container.querySelectorAll('.remove-option');

                removeButtons.forEach(btn => {
                    btn.style.display = options.length > 1 ? 'block' : 'none';
                });

                console.log(`Zaktualizowano przyciski usuwania. Opcji: ${options.length}`);
            }

            // Funkcja przeliczająca indeksy
            function reindexOptions() {
                const options = container.querySelectorAll('.option-item');

                options.forEach((option, index) => {
                    const dateInput = option.querySelector('.option-date');
                    const durationInput = option.querySelector('.option-duration');

                    if (dateInput) dateInput.name = `options[${index}].optionDate`;
                    if (durationInput) durationInput.name = `options[${index}].durationMinutes`;
                });
            }

            // Obsługa usuwania opcji
            container.addEventListener('click', function(e) {
                if (e.target.closest('.remove-option')) {
                    console.log('=== USUWANIE OPCJI ===');
                    e.target.closest('.option-item').remove();
                    reindexOptions();
                    updateRemoveButtons();
                }
            });

            // Podpięcie event listenera do przycisku
            addButton.addEventListener('click', addNewOption);
            console.log('Event listener dodany do przycisku "Dodaj opcję"');

            // Inicjalizacja na starcie
            updateRemoveButtons();
            console.log('=== INICJALIZACJA ZAKOŃCZONA ===');
        }

        // Uruchom inicjalizację
        window.addEventListener('DOMContentLoaded', initVotingForm);

        // Jeśli DOM jest już załadowany
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            console.log('DOM już załadowany, uruchamiam inicjalizację...');
            setTimeout(initVotingForm, 100);
        }

        // Testowe zdarzenie - wyświetl alert
        console.log('TEST: Przycisk powinien działać');
    </script>
</div>

<!-- Dodatkowe style (jeśli layout je obsługuje) -->
<th:block th:fragment="pageStyles">
    <style>
        .option-item { background-color: #f8f9fa; }
        .card { box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    </style>
</th:block>
</body>
</html>
