<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      lang="pl"
      th:replace="~{layout}">
<head>
    <title>Edytuj spotkanie - MeetHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="display-6">
            <i class="bi bi-bar-chart me-2"></i>Głosowania spotkania
        </h1>
        <a th:if="${isOrganizer}"
           th:href="@{/meetings/{meetingId}/votings/create(meetingId=${meetingId})}"
           class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Nowe głosowanie
        </a>
    </div>

    <!-- Komunikaty -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Lista głosowań -->
    <div th:if="${votings != null and !votings.empty}" class="row">
        <div th:each="voting : ${votings}" class="col-lg-6 mb-4">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0" th:text="${voting.title}"></h5>
                    <span class="badge"
                          th:class="${voting.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'">
                        <!-- POPRAWIONE: używamy name() zamiast displayName -->
                        <span th:text="${voting.status.name()}"></span>
                    </span>
                </div>
                <div class="card-body">
                    <p class="text-muted" th:text="${voting.description}"></p>

                    <div class="mb-3">
                        <small class="text-muted">
                            <i class="bi bi-clock me-1"></i>
                            <!-- POPRAWIONE: sprawdzamy czy deadlineDate jest null -->
                            <span th:if="${voting.deadlineDate != null}">
                                Kończy się:
                                <span th:text="${#temporals.format(voting.deadlineDate, 'dd.MM.yyyy HH:mm')}"></span>
                            </span>
                            <span th:if="${voting.deadlineDate == null}">Bez terminu końcowego</span>
                        </small>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-light text-dark">
                                <i class="bi bi-people me-1"></i>
                                <!-- POPRAWIONE: bezpieczne odwołanie z ? -->
                                <span th:text="${voting.stats?.totalVoters}"></span> głosujących
                            </span>
                        </div>
                        <a th:href="@{/meetings/{meetingId}/votings/{votingId}(meetingId=${meetingId}, votingId=${voting.id})}"
                           class="btn btn-outline-primary btn-sm">
                            <!-- POPRAWIONE: bezpieczne odwołania -->
                            <span th:if="${voting.hasVoted}">Zobacz wyniki</span>
                            <span th:if="${!voting.hasVoted and voting.status.name() == 'ACTIVE'}">Głosuj</span>
                            <span th:if="${!voting.hasVoted and voting.status.name() == 'CLOSED'}">Zobacz szczegóły</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Brak głosowań -->
    <div th:if="${votings == null or votings.empty}" class="text-center py-5">
        <i class="bi bi-bar-chart display-1 text-muted"></i>
        <h3 class="text-muted mt-3">Brak głosowań</h3>
        <p class="text-muted">Utwórz pierwsze głosowanie, aby wybrać najlepszy termin spotkania.</p>
        <a th:if="${isOrganizer}"
           th:href="@{/meetings/{meetingId}/votings/create(meetingId=${meetingId})}"
           class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Utwórz pierwsze głosowanie
        </a>
    </div>

    <!-- Powrót do spotkania -->
    <div class="text-center mt-4">
        <a th:href="@{/meetings/{meetingId}(meetingId=${meetingId})}"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Powrót do spotkania
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
