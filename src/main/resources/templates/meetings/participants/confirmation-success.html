<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <title>Potwierdzenie udziału - MeetHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <i class="bi bi-check-circle text-success display-1"></i>
                    <h2 class="card-title mt-3" th:text="${success}">Sukces!</h2>
                    <p class="card-text" th:if="${participant}">
                        Potwierdzono udział w spotkaniu:
                        <strong th:text="${meeting.title}"></strong>
                    </p>
                    <div class="mt-4">
                        <a th:href="@{/}" class="btn btn-primary">Strona główna</a>
                        <a th:if="${meeting}" th:href="@{/meetings/{id}(id=${meeting.id})}" class="btn btn-outline-secondary ms-2">
                            Przejdź do spotkania
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
