<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pl"
      th:replace="~{layout}">
<head>
    <title th:text="'Zasoby - ' + ${meeting?.title} + ' - MeetHub'">Zasoby spotkania - MeetHub</title>
</head>
<body>
<div th:fragment="content">
<!--    &lt;!&ndash; Komunikaty &ndash;&gt;-->
<!--    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">-->
<!--        <i class="bi bi-check-circle me-2"></i>-->
<!--        <span th:text="${success}"></span>-->
<!--        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>-->
<!--    </div>-->

<!--    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">-->
<!--        <i class="bi bi-exclamation-triangle me-2"></i>-->
<!--        <span th:text="${error}"></span>-->
<!--        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>-->
<!--    </div>-->

    <!-- Nagłówek -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/meetings}">Spotkania</a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/meetings/{id}(id=${meeting.id})}" th:text="${meeting.title}"></a>
                    </li>
                    <li class="breadcrumb-item active">Zasoby</li>
                </ol>
            </nav>
            <h1 class="display-6">
                <i class="bi bi-folder me-2"></i>Zasoby spotkania
            </h1>
            <p class="text-muted" th:text="${meeting.title}"></p>
        </div>
        <div>
            <a th:href="@{/meetings/{id}/resources/add(id=${meeting.id})}" class="btn btn-primary me-2">
                <i class="bi bi-plus-circle me-2"></i>Dodaj zasób
            </a>
            <a th:href="@{/meetings/{id}(id=${meeting.id})}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Powrót do spotkania
            </a>
        </div>
    </div>

    <!-- Lista zasobów -->
    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0">
                <i class="bi bi-files me-2"></i>Lista zasobów
                <span class="badge bg-secondary ms-2" th:text="${resources?.size() ?: 0}"></span>
            </h5>
        </div>
        <div class="card-body">
            <div th:if="${resources != null and !resources.empty}">
                <div th:each="resource : ${resources}" class="resource-item border-bottom pb-3 mb-3">
                    <div class="row align-items-center">
                        <div class="col-md-1 text-center">
                            <i th:if="${resource.resourceType.name() == 'DOCUMENT'}" class="bi bi-file-earmark-pdf display-6 text-danger"></i>
                            <i th:if="${resource.resourceType.name() == 'PRESENTATION'}" class="bi bi-file-earmark-ppt display-6 text-warning"></i>
                            <i th:if="${resource.resourceType.name() == 'IMAGE'}" class="bi bi-file-earmark-image display-6 text-success"></i>
                            <i th:if="${resource.resourceType.name() == 'VIDEO'}" class="bi bi-file-earmark-play display-6 text-primary"></i>
                            <i th:if="${resource.resourceType.name() == 'AUDIO'}" class="bi bi-file-earmark-music display-6 text-info"></i>
                            <i th:if="${resource.resourceType.name() == 'OTHER'}" class="bi bi-file-earmark display-6 text-secondary"></i>
                        </div>
                        <div class="col-md-5">
                            <h6 th:text="${resource.originalFilename}" class="mb-1"></h6>
                            <p class="text-muted small mb-1" th:text="${resource.mimeType}"></p>
                            <div class="small">
                                <span class="badge"
                                      th:class="${resource.accessLevel.name() == 'PUBLIC' ? 'bg-info' :
                                                (resource.accessLevel.name() == 'PARTICIPANTS' ? 'bg-primary' :
                                                (resource.accessLevel.name() == 'ORGANIZERS' ? 'bg-warning' : 'bg-secondary'))}"
                                      th:text="${resource.accessLevel.displayName}">
                                </span>
                                <span class="ms-2 text-muted" th:text="${resource.fileSizeFormatted}"></span>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <small class="text-muted">
                                Dodano: <span th:text="${#temporals.format(resource.uploadedAt, 'dd.MM.yyyy HH:mm')}"></span><br>
                                Przez: <span th:text="${resource.uploadedBy.firstName + ' ' + resource.uploadedBy.lastName}"></span>
                            </small>
                        </div>
                        <div class="col-md-3 text-end">
                            <!-- PRZEGLĄD -->
                            <a th:if="${resource.resourceType.name() == 'IMAGE' or
                                      resource.resourceType.name() == 'DOCUMENT' or
                                      resource.resourceType.name() == 'VIDEO' or
                                      resource.resourceType.name() == 'AUDIO' or
                                      (resource.mimeType != null and (resource.mimeType.contains('pdf') or
                                                                     resource.mimeType.contains('text') or
                                                                     resource.mimeType.contains('video') or
                                                                     resource.mimeType.contains('audio')))}"
                               th:href="@{/api/meetings/{meetingId}/resources/{resourceId}/preview(meetingId=${meeting.id}, resourceId=${resource.id})}"
                               class="btn btn-sm btn-outline-info me-1"
                               target="_blank"
                               title="Przeglądaj w przeglądarce">
                                <i class="bi bi-eye"></i>
                            </a>

                            <!-- POBIERANIE -->
                            <a th:href="@{/api/meetings/{meetingId}/resources/{resourceId}/download(meetingId=${meeting.id}, resourceId=${resource.id})}"
                               class="btn btn-sm btn-outline-primary me-1"
                               title="Pobierz na dysk">
                                <i class="bi bi-download"></i>
                            </a>

                            <!-- Edycja (tylko dla właściciela/organizatora) -->
                            <a th:if="${resource.canEdit}"
                               th:href="@{/meetings/{meetingId}/resources/{resourceId}/edit(meetingId=${meeting.id}, resourceId=${resource.id})}"
                               class="btn btn-sm btn-outline-secondary me-1"
                               title="Edytuj">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <!-- Usuwanie (tylko dla właściciela/organizatora) -->
                            <form th:if="${resource.canDelete}"
                                  th:action="@{/meetings/{meetingId}/resources/{resourceId}/delete(meetingId=${meeting.id}, resourceId=${resource.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Czy na pewno chcesz usunąć ten zasób?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Usuń">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Tagi -->
                    <div th:if="${resource.tags != null and !resource.tags.empty}" class="mt-2">
                        <small class="text-muted">Tagi:</small>
                        <span th:each="tag : ${resource.tags}" class="badge bg-light text-dark ms-1" th:text="${tag}"></span>
                    </div>

                    <!-- Opis -->
                    <div th:if="${resource.description}" class="mt-2">
                        <small class="text-muted">Opis:</small>
                        <p class="small mb-0" th:text="${resource.description}"></p>
                    </div>
                </div>
            </div>

            <div th:if="${resources == null or resources.empty}" class="text-center py-5">
                <i class="bi bi-folder-x display-1 text-muted"></i>
                <h4 class="text-muted mt-3">Brak zasobów</h4>
                <p class="text-muted">Dodaj pierwszy zasób do tego spotkania</p>
                <a th:href="@{/meetings/{id}/resources/add(id=${meeting.id})}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>Dodaj zasób
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .resource-item:hover {
        background-color: #f8f9fa;
        transition: background-color 0.2s;
        border-radius: 0.375rem;
    }

    .resource-item {
        padding: 1rem;
        margin: 0 -1rem;
    }
</style>
</body>
</html>
