<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pl"
      th:replace="~{layout}">
<head>
    <title>Edytuj zadanie - MeetHub</title>
</head>
<body>
<div th:fragment="content">
    <!-- Nagłówek -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="display-6">
                <i class="bi bi-pencil-square me-2"></i>
                Edytuj zadanie
            </h1>
            <p class="text-muted" th:text="'Spotkanie: ' + ${meeting.title}"></p>
        </div>
        <div>
            <a th:href="@{/meetings/{meetingId}/tasks/{taskId}(meetingId=${meeting.id}, taskId=${task.id})}"
               class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Powrót do zadania
            </a>
        </div>
    </div>

    <!-- Formularz edycji -->
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-pencil-square me-2"></i>Edycja zadania
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/meetings/{meetingId}/tasks/{taskId}/edit(meetingId=${meeting.id}, taskId=${task.id})}"
                          method="post">

                        <!-- Tytuł -->
                        <div class="mb-3">
                            <label for="title" class="form-label">
                                <strong>Tytuł zadania *</strong>
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="title"
                                   name="title"
                                   th:value="${task.title}"
                                   required
                                   maxlength="255"
                                   placeholder="Wprowadź tytuł zadania">
                            <div class="form-text">
                                Krótki i opisowy tytuł zadania (max 255 znaków)
                            </div>
                        </div>

                        <!-- Opis -->
                        <div class="mb-3">
                            <label for="description" class="form-label">
                                <strong>Opis zadania *</strong>
                            </label>
                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      rows="5"
                                      required
                                      maxlength="2000"
                                      placeholder="Opisz szczegóły zadania, wymagania i oczekiwania"
                                      th:text="${task.description}"></textarea>
                            <div class="form-text">
                                Szczegółowy opis zadania (max 2000 znaków)
                            </div>
                        </div>


<!--                        &lt;!&ndash; Termin &ndash;&gt;-->
<!--                        &lt;!&ndash; Deadline &ndash;&gt;-->
<!--                        <div class="mb-3">-->
<!--                            <label for="deadline" class="form-label">Termin wykonania *</label>-->
<!--                            <input type="datetime-local" class="form-control" id="deadline" name="deadline"-->
<!--                                   th:value="${#temporals.format(task.deadline, 'yyyy-MM-dd\'T\'HH:mm')}"-->
<!--                                   required>-->
<!--                        </div>-->

                        <!-- Ustawienia zaawansowane -->
                        <div class="card mb-3">
                            <div class="card-header bg-light">
                                <h6 class="card-title mb-0">
                                    <i class="bi bi-gear me-2"></i>Ustawienia zaawansowane
                                </h6>
                            </div>
                            <div class="card-body">
                                <!-- Samoprzypisanie -->
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           id="allowSelfAssignment"
                                           name="allowSelfAssignment"
                                           th:checked="${task.allowSelfAssignment}">
                                    <label class="form-check-label" for="allowSelfAssignment">
                                        <strong>Zezwól na samodzielne dołączanie</strong>
                                    </label>
                                    <div class="form-text">
                                        Użytkownicy będą mogli sami dołączać do tego zadania
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Przyciski -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/meetings/{meetingId}/tasks/{taskId}(meetingId=${meeting.id}, taskId=${task.id})}"
                               class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Anuluj
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Zapisz zmiany
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
