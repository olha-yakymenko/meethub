<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="pl"
      th:replace="~{layout}">
<head>
    <title>Przypisz użytkowników - MeetHub</title>
</head>
<body>
<div th:fragment="content">
    <!-- Nagłówek -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="display-6">
                <i class="bi bi-person-plus me-2"></i>
                Przypisz użytkowników do zadania
            </h1>
            <p class="text-muted" th:text="'Zadanie: ' + ${task.title}"></p>
            <p class="text-muted" th:text="'Spotkanie: ' + ${meeting.title}"></p>
        </div>
        <div>
            <a th:href="@{/meetings/{meetingId}/tasks/{taskId}(meetingId=${meeting.id}, taskId=${task.id})}"
               class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Powrót do zadania
            </a>
        </div>
    </div>

    <!-- Komunikaty -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- Dostępni użytkownicy -->
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-people me-2"></i>Dostępni uczestnicy
                    </h5>
                </div>
                <div class="card-body">
                    <div th:if="${availableUsers != null and !availableUsers.empty}">
                        <div th:each="user : ${availableUsers}" class="mb-2 p-2 border rounded">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="fw-bold" th:text="${user.firstName + ' ' + user.lastName}"></div>
                                    <small class="text-muted" th:text="${user.email}"></small>
                                </div>
                                <div>
                                    <form th:action="@{/meetings/{meetingId}/tasks/{taskId}/assign(meetingId=${meeting.id}, taskId=${task.id})}"
                                          method="post">
                                        <input type="hidden" name="userId" th:value="${user.id}">
                                        <button type="submit" class="btn btn-success btn-sm">
                                            <i class="bi bi-plus-circle me-1"></i>Przypisz
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div th:if="${availableUsers == null or availableUsers.empty}" class="text-center py-3">
                        <i class="bi bi-people display-4 text-muted"></i>
                        <p class="mt-3">Wszyscy uczestnicy są już przypisani do tego zadania</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Przypisani użytkownicy -->
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-check-circle me-2"></i>Przypisani użytkownicy
                    </h5>
                </div>
                <div class="card-body">
                    <div th:if="${assignedUsers != null and !assignedUsers.empty}">
                        <div th:each="user : ${assignedUsers}" class="mb-2 p-2 border rounded">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="fw-bold" th:text="${user.firstName + ' ' + user.lastName}"></div>
                                    <small class="text-muted" th:text="${user.email}"></small>
                                </div>
                                <div>
                                    <!-- Przycisk usuwania przypisania -->
                                    <div th:each="assignment : ${assignments}"
                                         th:if="${assignment.user.id == user.id}">
                                        <form th:action="@{/meetings/{meetingId}/tasks/{taskId}/assignment/{assignmentId}/remove(meetingId=${meeting.id}, taskId=${task.id})}"
                                              method="post">
                                            <input type="hidden" name="assignmentId" th:value="${assignment.id}">
                                            <button type="submit" class="btn btn-danger btn-sm"
                                                    onclick="return confirm('Czy na pewno chcesz usunąć to przypisanie?')">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div th:if="${assignedUsers == null or assignedUsers.empty}" class="text-center py-3">
                        <i class="bi bi-person-x display-4 text-muted"></i>
                        <p class="mt-3">Brak przypisanych użytkowników</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
