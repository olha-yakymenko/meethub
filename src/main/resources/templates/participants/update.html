<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl" th:replace="~{layout}">
<head>
    <title>Edytuj uczestnika - MeetHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Edytuj uczestnika</h1>
            <a th:href="@{/meetings/{meetingId}/participants(meetingId=${meeting.id})}"
               class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Powrót do listy
            </a>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <span th:text="${participant.user.firstName + ' ' + participant.user.lastName}"></span>
                    <small class="text-muted">(<span th:text="${participant.user.email}"></span>)</small>
                </h5>
            </div>
            <div class="card-body">
                <form th:action="@{/meetings/{meetingId}/participants/{participantId}/update(meetingId=${meeting.id}, participantId=${participant.id})}"
                      method="post">

                    <!-- Status uczestnictwa -->
                    <div class="mb-3">
                        <label class="form-label">Status uczestnictwa</label>
                        <select name="status" class="form-select" th:field="${participant.status}">
                            <option th:each="status : ${T(com.meethub.domain.model.enums.ParticipationStatus).values()}"
                                    th:value="${status}"
                                    th:text="${status.displayName ?: status}"
                                    th:selected="${participant.status == status}">
                            </option>
                        </select>
                    </div>

                    <!-- Poziom uprawnień -->
                    <div class="mb-3">
                        <label class="form-label">Poziom uprawnień</label>
                        <select name="permissionLevel" class="form-select" th:field="${participant.permissionLevel}">
                            <option th:each="level : ${T(com.meethub.domain.model.enums.PermissionLevel).values()}"
                                    th:value="${level}"
                                    th:text="${level.displayName ?: level}"
                                    th:selected="${participant.permissionLevel == level}">
                            </option>
                        </select>
                    </div>

                    <!-- Komentarz -->
                    <div class="mb-3">
                        <label class="form-label">Komentarz (opcjonalnie)</label>
                        <textarea name="comment" class="form-control" rows="3"
                                  th:field="${participant.comment}"
                                  placeholder="Dodaj komentarz do statusu uczestnika..."></textarea>
                    </div>

                    <!-- Informacje o uczestniku -->
                    <div class="mb-3">
                        <label class="form-label">Informacje o uczestniku</label>
                        <div class="card bg-light">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <strong>Email:</strong> <span th:text="${participant.user.email}"></span>
                                    </div>
                                    <div class="col-md-6">
                                        <strong>Data dołączenia:</strong>
                                        <span th:text="${#temporals.format(participant.createdAt, 'dd.MM.yyyy HH:mm')}"></span>
                                    </div>
                                </div>
                                <div class="row mt-2">
                                    <div class="col-md-6">
                                        <strong>Ostatnia odpowiedź:</strong>
                                        <span th:if="${participant.responseDate}"
                                              th:text="${#temporals.format(participant.responseDate, 'dd.MM.yyyy HH:mm')}">
                                        </span>
                                        <span th:unless="${participant.responseDate}" class="text-muted">-</span>
                                    </div>
                                    <div class="col-md-6">
                                        <strong>Token zaproszenia:</strong>
                                        <code th:text="${participant.invitationToken}"></code>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-2"></i>Zapisz zmiany
                        </button>
                        <a th:href="@{/meetings/{meetingId}/participants(meetingId=${meeting.id})}"
                           class="btn btn-outline-secondary">Anuluj</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Historia zmian statusu -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="card-title mb-0">Historia zmian statusu</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                        <tr>
                            <th>Data</th>
                            <th>Stary status</th>
                            <th>Nowy status</th>
                            <th>Kto zmienił</th>
                            <th>Komentarz</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="history : ${statusHistory}">
                            <td th:text="${#temporals.format(history.changedAt, 'dd.MM.yyyy HH:mm')}"></td>
                            <td>
                                    <span th:if="${history.oldStatus}"
                                          th:text="${history.oldStatus.displayName ?: history.oldStatus}"
                                          class="badge bg-secondary"></span>
                                <span th:unless="${history.oldStatus}" class="text-muted">-</span>
                            </td>
                            <td>
                                    <span th:text="${history.newStatus.displayName ?: history.newStatus}"
                                          th:classappend="${history.newStatus.name() == 'CONFIRMED'} ? 'badge bg-success' :
                                                          ${history.newStatus.name() == 'DECLINED'} ? 'badge bg-danger' :
                                                          'badge bg-warning'"></span>
                            </td>
                            <td th:text="${history.changedByUserId}"></td>
                            <td th:text="${history.comment} ?: '-'"></td>
                        </tr>
                        <tr th:if="${statusHistory.empty}">
                            <td colspan="5" class="text-center text-muted">
                                Brak historii zmian
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
