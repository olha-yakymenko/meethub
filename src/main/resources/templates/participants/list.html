<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl" th:replace="~{layout}">
<head>
    <title>Uczestnicy spotkania - MeetHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Zarządzanie uczestnikami spotkania</h1>
            <a th:href="@{/meetings/{meetingId}/participants/invite(meetingId=${meetingId})}"
               class="btn btn-primary">
                <i class="bi bi-person-plus me-2"></i>Zaproś uczestników
            </a>
        </div>

        <!-- Statystyki -->
        <div class="row" th:if="${stats}">
            <div class="col-md-2">
                <div class="card text-white bg-primary">
                    <div class="card-body text-center">
                        <h3 th:text="${stats.totalInvited}">0</h3>
                        <p>Zaproszonych</p>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card text-white bg-success">
                    <div class="card-body text-center">
                        <h3 th:text="${stats.totalConfirmed}">0</h3>
                        <p>Potwierdzonych</p>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card text-white bg-warning">
                    <div class="card-body text-center">
                        <h3 th:text="${stats.waitlistCount}">0</h3>
                        <p>Oczekujących</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista uczestników -->
        <div class="card mt-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Lista uczestników</h5>
                <span class="badge bg-secondary" th:text="${participants.size() + ' uczestników'}"></span>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th>Użytkownik</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Uprawnienia</th>
                            <th>Data odpowiedzi</th>
                            <th>Akcje</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="participant : ${participants}">
                            <td>
                                <strong th:text="${participant.user.firstName + ' ' + participant.user.lastName}"></strong>
                            </td>
                            <td th:text="${participant.user.email}"></td>
                            <td>
                                <span th:classappend="${participant.status.name() == 'CONFIRMED'} ? 'badge bg-success' :
                                                      (${participant.status.name() == 'INVITED'} ? 'badge bg-primary' :
                                                      (${participant.status.name() == 'DECLINED'} ? 'badge bg-danger' :
                                                      (${participant.status.name() == 'TENTATIVE'} ? 'badge bg-warning' :
                                                      'badge bg-secondary')))"
                                      th:text="${participant.status.displayName ?: participant.status}">
                                </span>
                            </td>
                            <td>
                                <span th:classappend="${participant.permissionLevel.name() == 'MODERATOR'} ? 'badge bg-danger' :
                                                      (${participant.permissionLevel.name() == 'CONTRIBUTOR'} ? 'badge bg-info' :
                                                      'badge bg-secondary')"
                                      th:text="${participant.permissionLevel.displayName ?: participant.permissionLevel}">
                                </span>
                            </td>
                            <td>
                                <span th:if="${participant.responseDate}"
                                      th:text="${#temporals.format(participant.responseDate, 'dd.MM.yyyy HH:mm')}">
                                </span>
                                <span th:unless="${participant.responseDate}" class="text-muted">-</span>
                            </td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/meetings/{meetingId}/participants/{participantId}/edit(meetingId=${meetingId}, participantId=${participant.id})}"
                                       class="btn btn-outline-primary" title="Edytuj">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button th:if="${isOrganizer}"
                                            th:data-user-name="${participant.user.firstName}"
                                            th:data-participant-id="${participant.id}"
                                            onclick="confirmDelete(this.getAttribute('data-user-name'), this.getAttribute('data-participant-id'))"
                                            class="btn btn-outline-danger" title="Usuń">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pusta lista -->
                <div th:if="${participants.empty}" class="text-center py-4">
                    <i class="bi bi-people display-1 text-muted"></i>
                    <h4 class="text-muted mt-3">Brak uczestników</h4>
                    <p class="text-muted">Zaproś pierwszych uczestników do tego spotkania</p>
                    <a th:href="@{/meetings/{meetingId}/participants/invite(meetingId=${meetingId})}"
                       class="btn btn-primary">
                        <i class="bi bi-person-plus me-2"></i>Zaproś uczestników
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function confirmDelete(userName, participantId) {
            if (confirm('Czy na pewno chcesz usunąć uczestnika ' + userName + '?')) {
                fetch('/meetings/' + [[${meetingId}]] + '/participants/' + participantId, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')
                    }
                }).then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Błąd podczas usuwania uczestnika');
                    }
                });
            }
        }
    </script>
</div>
</body>
</html>
