<!-- src/main/resources/templates/meetings/tasks/edit.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl" th:replace="~{layout}">
<head>
    <title>Edytuj zadanie - MeetHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-0">
                        <i class="bi bi-pencil me-2"></i>Edytuj zadanie
                    </h1>
                    <p class="text-muted mb-0" th:text="'Spotkanie: ' + ${meeting.title}"></p>
                </div>
                <a th:href="@{/meetings/{meetingId}/tasks/{taskId}(meetingId=${meeting.id}, taskId=${task.id})}"
                   class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-2"></i>Powrót do zadania
                </a>
            </div>

            <!-- Messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form -->
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/meetings/{meetingId}/tasks/{taskId}/edit(meetingId=${meeting.id}, taskId=${task.id})}"
                          method="post">

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label">Tytuł zadania *</label>
                            <input type="text" class="form-control" id="title" name="title"
                                   th:value="${task.title}" required maxlength="255">
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Opis zadania *</label>
                            <textarea class="form-control" id="description" name="description"
                                      rows="5" required th:text="${task.description}"></textarea>
                        </div>

                        <!-- Deadline -->
                        <div class="mb-3">
                            <label for="deadline" class="form-label">Termin wykonania *</label>
                            <input type="datetime-local" class="form-control" id="deadline" name="deadline"
                                   th:value="${#dates.format(task.deadline, 'yyyy-MM-dd') + 'T' + #dates.format(task.deadline, 'HH:mm')}"
                                   required>
                        </div>

                        <!-- Allow Self Assignment -->
                        <div class="mb-3 form-check form-switch">
                            <input type="checkbox" class="form-check-input" id="allowSelfAssignment"
                                   name="allowSelfAssignment" value="true"
                                   th:checked="${task.allowSelfAssignment}">
                            <label class="form-check-label" for="allowSelfAssignment">
                                Zezwól na samodzielne dołączanie do zadania
                            </label>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/meetings/{meetingId}/tasks/{taskId}(meetingId=${meeting.id}, taskId=${task.id})}"
                               class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Anuluj
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Zapisz zmiany
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
