<!-- src/main/resources/templates/locations/edit.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl" th:replace="~{layout}">
<head>
    <title>Edytuj lokalizację - MeetHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-0">
                        <i class="bi bi-pencil me-2"></i>Edytuj lokalizację
                    </h1>
                </div>
                <a th:href="@{/locations/{id}(id=${locationId})}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-2"></i>Powrót
                </a>
            </div>

            <!-- Messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Form -->
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/locations/{id}/edit(id=${locationId})}" th:object="${locationRequest}" method="post">

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Nazwa *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required maxlength="255">
                        </div>

                        <!-- Type -->
                        <div class="mb-3">
                            <label for="type" class="form-label">Typ *</label>
                            <input type="text" class="form-control" id="type" th:field="*{type}" required>
                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <label for="address" class="form-label">Adres</label>
                            <input type="text" class="form-control" id="address" th:field="*{address}">
                        </div>

                        <!-- City -->
                        <div class="mb-3">
                            <label for="city" class="form-label">Miasto</label>
                            <input type="text" class="form-control" id="city" th:field="*{city}">
                        </div>

                        <!-- Country -->
                        <div class="mb-3">
                            <label for="country" class="form-label">Kraj</label>
                            <input type="text" class="form-control" id="country" th:field="*{country}">
                        </div>

                        <!-- Latitude & Longitude -->
                        <div class="mb-3 row">
                            <div class="col">
                                <label for="latitude" class="form-label">Szerokość geograficzna</label>
                                <input type="text" class="form-control" id="latitude" th:field="*{latitude}">
                            </div>
                            <div class="col">
                                <label for="longitude" class="form-label">Długość geograficzna</label>
                                <input type="text" class="form-control" id="longitude" th:field="*{longitude}">
                            </div>
                        </div>

                        <!-- Virtual Meeting URL -->
                        <div class="mb-3">
                            <label for="virtualMeetingUrl" class="form-label">Link do spotkania wirtualnego</label>
                            <input type="url" class="form-control" id="virtualMeetingUrl" th:field="*{virtualMeetingUrl}">
                        </div>

                        <!-- Access Code -->
                        <div class="mb-3">
                            <label for="accessCode" class="form-label">Kod dostępu</label>
                            <input type="text" class="form-control" id="accessCode" th:field="*{accessCode}">
                        </div>

                        <!-- Driving Instructions -->
                        <div class="mb-3">
                            <label for="drivingInstructions" class="form-label">Instrukcje dojazdu</label>
                            <textarea class="form-control" id="drivingInstructions" th:field="*{drivingInstructions}" rows="3"></textarea>
                        </div>

                        <!-- Timezone -->
                        <div class="mb-3">
                            <label for="timezone" class="form-label">Strefa czasowa</label>
                            <input type="text" class="form-control" id="timezone" th:field="*{timezone}">
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/locations/{id}(id=${locationId})}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Anuluj
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Zapisz zmiany
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
