<!-- meeting_started.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spotkanie się rozpoczęło</title>
</head>
<body>
<h2>🎉 Spotkanie się rozpoczęło!</h2>
<p>Cześć {{organizerName}},</p>
<p>Spotkanie właśnie się rozpoczęło:</p>

<div style="background-color: #e8f5e9; padding: 20px; border-radius: 8px;">
    <h3>{{meetingTitle}}</h3>
    <p><strong>⏰ Rozpoczęto:</strong> {{meetingTime}}</p>
    {{#location}}
    <p><strong>📍 Lokalizacja:</strong> {{location}}</p>
    {{/location}}
</div>

<p>Pamiętaj o prowadzeniu spotkania zgodnie z agendą!</p>

<p>Pozdrawiamy,<br>Zespół MeetHub</p>
</body>
</html>
